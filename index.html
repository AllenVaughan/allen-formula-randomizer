<!DOCTYPE html>
<html>
<head>
<title>Allen Formula Wrestling Randomizer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}

button{
    padding:12px 24px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>🏆 Allen Formula Wrestling Randomizer</h1>

<button onclick="randomMatch()">
🎲 Random Match
</button>

<p id="result">
Click Random Match
</p>

<script>

const matches = [

{
  name:"Steve Austin vs Bret Hart",
  event:"WrestleMania 13",
  promotion:"WWE",
  year:1997
},

{
  name:"The Undertaker vs Shawn Michaels",
  event:"WrestleMania 25",
  promotion:"WWE",
  year:2009
},

{
  name:"The Undertaker vs Shawn Michaels (Hell in a Cell)",
  event:"Badd Blood",
  promotion:"WWE",
  year:1997
},

{
  name:"CM Punk vs John Cena",
  event:"Money in the Bank",
  promotion:"WWE",
  year:2011
},

{
  name:"Hulk Hogan vs The Rock",
  event:"WrestleMania X8",
  promotion:"WWE",
  year:2002
}
    
];

function randomMatch(){

const match =
matches[
Math.floor(
Math.random() * matches.length
)
];

document.getElementById("result").innerHTML =
"<h2>" + match.name + "</h2>" +
"<p>Event: " + match.event + "</p>" +
"<p>Year: " + match.year + "</p>";

}

</script>

</body>
</html>
