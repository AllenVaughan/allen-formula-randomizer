<!DOCTYPE html>
<html>
<head>
<title>Allen Formula Wrestling Randomizer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}

button{
    padding:12px 24px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>🏆 Allen Formula Wrestling Randomizer</h1>

<button onclick="randomMatch()">
🎲 Random Match
</button>

<p id="result">
Click Random Match
</p>

<script>

const matches = [

{
  name:"Steve Austin vs Bret Hart",
  event:"WrestleMania 13",
  promotion:"WWE",
  year:1997,
  tier:"S+"
},

{
  name:"The Undertaker vs Shawn Michaels",
  event:"WrestleMania 25",
  promotion:"WWE",
  year:2009,
  tier:"S+"
},

{
  name:"The Undertaker vs Shawn Michaels (Hell in a Cell)",
  event:"Badd Blood",
  promotion:"WWE",
  year:1997,
  tier:"S+"
},

{
  name:"CM Punk vs John Cena",
  event:"Money in the Bank",
  promotion:"WWE",
  year:2011,
  tier:"S+"
},

{
  name:"Hulk Hogan vs The Rock",
  event:"WrestleMania X8",
  promotion:"WWE",
  year:2002,
  tier:"S+"
},

{
  name:"TLC II",
  event:"WrestleMania X-Seven",
  promotion:"WWE",
  year:2001,
  tier:"S+"
},

{
  name:"Randy Savage vs Ricky Steamboat",
  event:"WrestleMania III",
  promotion:"WWE",
  year:1987,
  tier:"S+"
},

{
  name:"The Undertaker vs Triple H",
  event:"WrestleMania 28",
  promotion:"WWE",
  year:2012,
  tier:"S+"
},

{
  name:"Kurt Angle vs Shawn Michaels",
  event:"WrestleMania 21",
  promotion:"WWE",
  year:2005,
  tier:"S+"
},

{
  name:"Chris Benoit vs Shawn Michaels vs Triple H",
  event:"WrestleMania XX",
  promotion:"WWE",
  year:2004,
  tier:"S+"
},

{
  name:"Daniel Bryan vs Batista vs Randy Orton",
  event:"WrestleMania 30",
  promotion:"WWE",
  year:2014,
  tier:"S+"
},
    
];

function randomMatch(){

const match =
matches[
Math.floor(
Math.random() * matches.length
)
];

document.getElementById("result").innerHTML =

"<h2>" + match.name + "</h2>" +

"<p>Event: " + match.event + "</p>" +

"<p>Promotion: " + match.promotion + "</p>" +

"<p>Year: " + match.year + "</p>" +

"<p>Tier: " + match.tier + "</p>";

}

</script>

</body>
</html>
