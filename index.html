<!DOCTYPE html>
<html>
<head>
<title>Allen Formula Wrestling Randomizer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
    max-width:900px;
    margin:auto;
}

button{
    padding:12px 24px;
    font-size:18px;
    background:#c8102e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#e31837;
}

.card{
    background:#222;
    border-radius:12px;
    padding:25px;
    margin-top:25px;
    text-align:left;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

.tier-splus{
    color:#FFD700;
    font-weight:bold;
    font-size:20px;
}

.tier-s{
    color:#87CEEB;
    font-weight:bold;
    font-size:20px;
}

.label{
    color:#FFD700;
    font-weight:bold;
}

    @media (max-width: 600px){

    body{
        padding:20px;
    }

    h1{
        font-size:28px;
    }

    button{
        width:100%;
        font-size:20px;
        padding:16px;
    }

    .card{
        padding:20px;
    }

    .card h2{
        font-size:24px;
    }

    .event{
        font-size:18px;
    }
    
</style>

</head>

<body>

<h1>🏆 Allen Formula Wrestling Randomizer</h1>

<button onclick="randomMatch()">
🎲 Random Match
</button>

<p id="result">
Click Random Match
</p>

<script>

const matches = [

{
  name:"Steve Austin vs Bret Hart",
  event:"WrestleMania 13",
  promotion:"WWE",
  year:1997,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"One of the greatest double turns in wrestling history and the match that helped launch the Attitude Era."
},

{
  name:"The Undertaker vs Shawn Michaels",
  event:"WrestleMania 25",
  promotion:"WWE",
  year:2009,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"A near-perfect WrestleMania classic filled with drama, athleticism and unforgettable near falls."
},

{
  name:"The Undertaker vs Shawn Michaels (Hell in a Cell)",
  event:"Badd Blood",
  promotion:"WWE",
  year:1997,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"The first Hell in a Cell match and the unforgettable debut of Kane."
},

{
  name:"CM Punk vs John Cena",
  event:"Money in the Bank",
  promotion:"WWE",
  year:2011,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"The defining match of the Summer of Punk in front of one of the hottest crowds ever."
},

{
  name:"Hulk Hogan vs The Rock",
  event:"WrestleMania X8",
  promotion:"WWE",
  year:2002,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"Perhaps the loudest crowd reaction in wrestling history."
},

{
  name:"TLC II",
  event:"WrestleMania X-Seven",
  promotion:"WWE",
  year:2001,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"The definitive TLC match and one of the greatest tag team spectacles ever."
},

{
  name:"Randy Savage vs Ricky Steamboat",
  event:"WrestleMania III",
  promotion:"WWE",
  year:1987,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"A technical masterpiece that helped establish WrestleMania as the industry's biggest stage."
},

{
  name:"The Undertaker vs Triple H",
  event:"WrestleMania 28",
  promotion:"WWE",
  year:2012,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"A brutal end-of-an-era masterpiece built around emotion, storytelling and legacy."
},

{
  name:"Kurt Angle vs Shawn Michaels",
  event:"WrestleMania 21",
  promotion:"WWE",
  year:2005,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"Two all-time great performers delivering a dream match that exceeded expectations."
},

{
  name:"Chris Benoit vs Shawn Michaels vs Triple H",
  event:"WrestleMania XX",
  promotion:"WWE",
  year:2004,
  whereToWatch:"WWE Vault (YouTube) / Netflix",
  tier:"S+",
  whyWatch:"One of the greatest triple-threat matches ever contested with nonstop drama and near falls."
}    
    
];

function randomMatch(){

const match =
matches[
Math.floor(
Math.random() * matches.length
)
];

let tierClass = "tier-s";

if(match.tier === "S+"){
    tierClass = "tier-splus";
}

document.getElementById("result").innerHTML =

"<div class='card'>" +

"<h2>" + match.name + "</h2>" +

"<p class='event'>" +
match.event +
"</p>" +

"<p class='metadata'>" +
match.promotion +
" • " +
match.year +
"</p>" +

"<hr>" +

"<p><span class='label'>📺 Where to Watch</span><br>" +
match.whereToWatch +
"</p>" +

"<p><span class='label'>💡 Why Watch</span><br>" +
match.whyWatch +
"</p>" +

"<p><span class='label'>🏆 Tier</span><br>" +
"<span class='" + tierClass + "'>" +
match.tier +
"</span></p>" +

"</div>";
}

</script>

</body>
</html>
