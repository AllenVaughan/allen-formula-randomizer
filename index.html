<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allen Formula Wrestling Randomizer</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    color:gold;
    text-align:center;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

button{
    background:#c8102e;
    color:white;
    border:none;
    padding:12px 18px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#e31837;
}

.card{
    background:#222;
    border-radius:12px;
    padding:25px;
    margin-top:20px;
}

.badge{
    display:inline-block;
    background:gold;
    color:black;
    padding:4px 10px;
    border-radius:20px;
    font-weight:bold;
}

.label{
    color:gold;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>🏆 Allen Formula Wrestling Randomizer</h1>

<div class="controls">

<button onclick="randomMatch()">
🎲 Random Match
</button>

<button onclick="hallOfFameMatch()">
🏆 Hall of Fame Match
</button>

</div>

<div id="result" class="card">

Click a button to get a recommendation.

</div>

<script>

let matches = [];

async function loadMatches(){

    const response =
        await fetch("top75_matches.json");

    const data =
        await response.json();

    matches = data.matches;
}

function pickRandom(array){

    return array[
        Math.floor(Math.random() * array.length)
    ];

}

function randomMatch(){

    if(matches.length === 0){

        document.getElementById("result").innerHTML =
            "Loading...";

        return;
    }

    const match =
        pickRandom(matches);

    document.getElementById("result").innerHTML = `

        <h2>${match.name}</h2>

        <p>
        <strong>Event:</strong>
        ${match.event}
        </p>

        <p>
        <strong>Promotion:</strong>
        ${match.promotion}
        </p>

        <p>
        <strong>Year:</strong>
        ${match.year}
        </p>

        <p>
        <strong>Tier:</strong>
        ${match.tier}
        </p>

        <p>
        <strong>Allen Score:</strong>
        ${match.allenScore}
        </p>

        <h3>Why Watch</h3>

        <p>${match.why}</p>

    `;
}

loadMatches();

</script>
