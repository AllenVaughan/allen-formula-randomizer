<!DOCTYPE html>
<html>
<head>
<title>Allen Formula Wrestling Randomizer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}

button{
    padding:12px 24px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>🏆 Allen Formula Wrestling Randomizer</h1>

<button onclick="randomMatch()">
🎲 Random Match
</button>

<p id="result">
Click Random Match
</p>

<script>

const matches = [
"Steve Austin vs Bret Hart",
"CM Punk vs John Cena",
"Kazuchika Okada vs Kenny Omega",
"The Undertaker vs Shawn Michaels"
];

function randomMatch(){

const match =
matches[
Math.floor(
Math.random() * matches.length
)
];

document.getElementById("result").innerHTML =
match;

}

</script>

</body>
</html>
